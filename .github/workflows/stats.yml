name: Refresh stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render cards
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "STATS_TOKEN is not set. Leaving the committed cards unchanged."
            exit 0
          fi
          python3 stats/render.py
      - name: Commit updated cards
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/*.svg
          git commit -m "Refresh profile stats"
          git push
